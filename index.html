<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DIRTYGEN — Смени канал</title>
<meta name="description" content="Смени канал — смени взгляд. Грязный Гена (DIRTYGEN) — клип «Смени канал» на трёх частотах.">
<meta property="og:title" content="DIRTYGEN — Смени канал">
<meta property="og:description" content="Грязный Гена · клип «Смени канал» — три версии на трёх каналах.">
<meta property="og:image" content="assets/img/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="assets/img/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- Стартовый экран -->
<div id="power">
  <div class="power-inner">
    <div class="power-brand">DIRTYGEN</div>
    <div class="power-dot"></div>
    <div class="power-hint">нажми, чтобы смотреть</div>
    <div class="power-sub">свайп · колесо · ← → — каналы</div>
  </div>
</div>

<!-- Вспышка помех при смене канала -->
<canvas id="static"></canvas>

<!-- Каналы -->
<main id="stage">

  <section class="channel" data-ch="0">
    <video src="video/ch1_main.mp4" preload="auto" playsinline></video>
    <div class="vign"></div>
  </section>

  <section class="channel" data-ch="1">
    <video src="video/ch2_night.mp4" preload="metadata" playsinline></video>
    <div class="vign"></div>
  </section>

  <section class="channel" data-ch="2">
    <video src="video/ch3_dawn.mp4" preload="metadata" playsinline></video>
    <div class="vign"></div>
  </section>

  <section class="channel artist" data-ch="3">
    <div class="vign"></div>
    <div class="artist-inner">
      <div class="artist-tag">DIRTYGEN · АРТИСТ</div>
      <h1 class="glitch" data-text="ГРЯЗНЫЙ ГЕНА">ГРЯЗНЫЙ ГЕНА</h1>
      <div class="quote">«Смени канал — смени взгляд»</div>
      <nav class="links">
        <a href="https://www.youtube.com/@igra_knyazey" target="_blank" rel="noopener">YOUTUBE&nbsp;↗</a>
        <a href="https://t.me/graygendalf" target="_blank" rel="noopener">TELEGRAM&nbsp;↗</a>
        <a href="https://github.com/Genocide12/DirtyGen" target="_blank" rel="noopener">GITHUB&nbsp;↗</a>
      </nav>
      <div class="copy">© ГРЯЗНЫЙ ГЕНА · трек «СМЕНИ КАНАЛ»</div>
    </div>
  </section>

</main>

<!-- Шапка -->
<header id="osdTop">
  <div class="osd-brand" id="osdBrand" title="Грязный Гена">DIRTYGEN</div>
  <div class="osd-ch" id="osdCh" title="Все страницы">CH 01 / 03</div>
</header>

<div id="chMenu"></div>

<div id="chSplash"><span id="splashNum">CH 01</span><span id="splashName">СМЕНИ КАНАЛ</span></div>

<div id="endCard"><span>СВАЙП&nbsp;→</span></div>

<!-- CRT-атмосфера -->
<div id="crt"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
